<!doctype html>
<html lang="tr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Glyph Voice Wave</title>
<style>
:root{--bg:#f2efe9;--fg:#141414;--muted:#6d6d6d;--card:#fff;--line:#ddd;--accent:#d71921}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#0e0e0e;--fg:#eee;--muted:#8d8d8d;--card:#191919;--line:#2a2a2a}}
:root[data-theme="dark"]{--bg:#0e0e0e;--fg:#eee;--muted:#8d8d8d;--card:#191919;--line:#2a2a2a}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--fg);font:15px/1.45 system-ui,sans-serif}
main{max-width:1000px;margin:0 auto;padding:20px 16px 40px;display:grid;grid-template-columns:minmax(0,1fr) 320px;gap:20px}
@media (max-width:760px){main{grid-template-columns:1fr}}
h1{grid-column:1/-1;font-size:20px;margin:0}
.stage{background:var(--card);border-radius:28px;padding:20px;display:flex;flex-direction:column;align-items:center;gap:12px}
canvas#m{width:100%;max-width:440px;aspect-ratio:1}
canvas#spec{width:100%;max-width:440px;height:70px}
.panel{background:var(--card);border-radius:28px;padding:18px;display:flex;flex-direction:column;gap:14px}
label{font-size:12px;color:var(--muted);display:block;margin-bottom:4px;text-transform:uppercase;letter-spacing:.06em}
input[type=text],select{width:100%;padding:10px 12px;border-radius:12px;border:1px solid var(--line);background:transparent;color:inherit;font:inherit}
.row{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
button{border:0;border-radius:999px;padding:10px 16px;font:inherit;cursor:pointer;background:var(--line);color:inherit}
button.primary{background:var(--accent);color:#fff;font-weight:600}
.meta{font:12px/1.5 ui-monospace,monospace;color:var(--muted);word-break:break-all}
summary{cursor:pointer;font-weight:600;margin-bottom:8px}
.sl{display:grid;grid-template-columns:1fr auto;gap:2px 8px;margin:8px 0}
.sl span{font-size:13px}.sl output{font:12px ui-monospace,monospace;color:var(--muted)}
.sl input{grid-column:1/-1;width:100%;accent-color:var(--accent)}
textarea{width:100%;height:140px;border-radius:12px;border:1px solid var(--line);background:transparent;color:inherit;font:12px ui-monospace,monospace;padding:8px}
audio{width:100%}
</style>
</head>
<body>
<main>
<h1>Glyph Voice Wave</h1>
<section class="stage">
  <canvas id="m" width="880" height="880" aria-label="Glyph Matrix"></canvas>
  <canvas id="spec" width="880" height="140" aria-hidden="true"></canvas>
  <div class="meta" id="info">Bir ses kaynağı seç.</div>
</section>
<section class="panel">
  <div>
    <label>Ses kaynağı</label>
    <div class="row">
      <button class="primary" id="demo">Demo ritim</button>
      <button id="tab">Sekme sesi</button>
      <button id="mic">Mikrofon (konuş)</button>
      <button id="stop">Durdur</button>
    </div>
  </div>
  <div>
    <label>Dosya</label>
    <input type="file" id="file" accept="audio/*,video/*">
  </div>
  <div>
    <label>İnternetten ses URL'si</label>
    <div class="row"><input type="text" id="url" placeholder="https://…/sarki.mp3" style="flex:1"><button id="go">Çal</button></div>
  </div>
  <audio id="player" controls crossorigin="anonymous"></audio>
  <details open><summary>Parametreler</summary><div id="sliders"></div></details>
  <div class="row"><button id="reset">Varsayılan</button><button id="copy">JSON kopyala</button></div>
  <textarea id="json" spellcheck="false"></textarea>
  <div class="meta">“Sekme sesi”: YouTube/Spotify sekmesini seç ve “sekme sesini de paylaş”ı işaretle. URL yalnızca CORS izin veren adreslerde çalışır.</div>
</section>
</main>
<script>
// 1:1 with MusicVisualizer (waveform peaks per slice) + effects.VoiceWave (OpenGlyph), plus knobs.
const ROWS=[7,11,15,17,19,21,21,23,23,25,25,25,25,25,25,25,23,23,21,21,19,17,15,11,7];
const EXISTS=new Uint8Array(625);for(let y=0;y<25;y++){const s=(25-ROWS[y])>>1;for(let x=s;x<s+ROWS[y];x++)EXISTS[y*25+x]=1;}
const DEF={frameMs:40,windowMs:6,span:10,maxH:7,flat:5,taperEnd:9,gate:0.015,gainTarget:0.6,gainSpeed:0.06,gainMax:40,curve:1.5,alternate:1,staleMs:400};
const SPEC=[
 ['frameMs','Dilim (sütun) süresi ms',[16,100,1]],
 ['windowMs','Ölçüm penceresi ms (kısa = sivri)',[1,40,0.5]],
 ['span','Yarı genişlik (sütun)',[6,12,1]],
 ['maxH','En yüksek çizgi (satır)',[3,12,1]],
 ['flat','Tam boy bölge (sütun)',[0,10,1]],
 ['taperEnd','Çizgiye inme noktası',[1,12,1]],
 ['gate','Sessizlik eşiği',[0,0.1,0.001]],
 ['gainTarget','Hedef yükseklik',[0.3,1.5,0.01]],
 ['gainSpeed','Otomatik kazanç hızı',[0,0.3,0.005]],
 ['gainMax','En fazla kazanç',[1,80,1]],
 ['curve','Sıkıştırma (1=doğrusal)',[0.3,1.5,0.01]],
 ['alternate','Sol/sağ farklı (0=ayna)',[0,1,1]],
];
let P={...DEF};try{Object.assign(P,JSON.parse(localStorage.getItem('og-wave')||'{}'))}catch(e){}
const sl=document.getElementById('sliders'),js=document.getElementById('json');
function buildSliders(){sl.innerHTML='';for(const [k,t,[a,b,s]] of SPEC){const d=document.createElement('div');d.className='sl';
  d.innerHTML=`<span>${t}</span><output>${P[k]}</output><input type="range" min="${a}" max="${b}" step="${s}" value="${P[k]}">`;
  const i=d.querySelector('input'),o=d.querySelector('output');i.oninput=()=>{P[k]=+i.value;o.textContent=P[k];save();};sl.appendChild(d);}save();}
function save(){js.value=JSON.stringify(P,null,1);try{localStorage.setItem('og-wave',JSON.stringify(P))}catch(e){}}
js.oninput=()=>{try{Object.assign(P,JSON.parse(js.value));buildSliders();}catch(e){}};
document.getElementById('reset').onclick=()=>{P={...DEF};buildSliders();};
document.getElementById('copy').onclick=()=>navigator.clipboard.writeText(js.value);
buildSliders();

// ---- audio ----
let ac=null,an=null,src=null,stream=null,demoNodes=[];
const player=document.getElementById('player');let mediaSrc=null;
function ctx(){if(!ac){ac=new AudioContext();an=ac.createAnalyser();an.fftSize=2048;an.smoothingTimeConstant=0;}return ac;}
function stopAll(){if(src&&src!==mediaSrc){try{src.disconnect()}catch(e){}}src=null;
  if(stream){stream.getTracks().forEach(t=>t.stop());stream=null;}
  demoNodes.forEach(n=>{try{n.stop()}catch(e){}});demoNodes=[];clearInterval(demoTimer);player.pause();}
function connect(node,toSpeaker){node.connect(an);if(toSpeaker)node.connect(ac.destination);src=node;}
document.getElementById('stop').onclick=stopAll;
document.getElementById('mic').onclick=async()=>{stopAll();ctx();await ac.resume();
  stream=await navigator.mediaDevices.getUserMedia({audio:{echoCancellation:false,noiseSuppression:false,autoGainControl:false}});
  connect(ac.createMediaStreamSource(stream),false);info('Mikrofon');};
document.getElementById('tab').onclick=async()=>{stopAll();ctx();await ac.resume();
  try{stream=await navigator.mediaDevices.getDisplayMedia({video:true,audio:true});}catch(e){info('İptal edildi');return;}
  if(!stream.getAudioTracks().length){info('Sekme sesi paylaşılmadı');stream.getTracks().forEach(t=>t.stop());stream=null;return;}
  connect(ac.createMediaStreamSource(new MediaStream(stream.getAudioTracks())),false);info('Sekme sesi');};
function playMedia(url,name){stopAll();ctx();ac.resume();player.src=url;
  if(!mediaSrc){mediaSrc=ac.createMediaElementSource(player);mediaSrc.connect(ac.destination);}
  mediaSrc.connect(an);src=mediaSrc;player.play().catch(e=>info('Oynatılamadı: '+e.message));info(name);}
document.getElementById('file').onchange=e=>{const f=e.target.files[0];if(f)playMedia(URL.createObjectURL(f),f.name);};
document.getElementById('go').onclick=()=>{const u=document.getElementById('url').value.trim();if(u)playMedia(u,u);};
let demoTimer=null;
document.getElementById('demo').onclick=async()=>{stopAll();ctx();await ac.resume();
  const out=ac.createGain();out.gain.value=0.5;out.connect(an);out.connect(ac.destination);src=out;
  const bpm=118,beat=60/bpm;let step=0,t0=ac.currentTime+0.05;const bass=[41,41,44,39];
  function sched(){while(t0<ac.currentTime+0.3){const s=step%16,t=t0;
    if(s%4===0){const o=ac.createOscillator(),g=ac.createGain();o.frequency.setValueAtTime(140,t);o.frequency.exponentialRampToValueAtTime(40,t+0.15);
      g.gain.setValueAtTime(1,t);g.gain.exponentialRampToValueAtTime(0.001,t+0.3);o.connect(g).connect(out);o.start(t);o.stop(t+0.3);}
    if(s%2===1){const n=ac.createBufferSource(),b=ac.createBuffer(1,4410,44100),d=b.getChannelData(0);for(let i=0;i<d.length;i++)d[i]=(Math.random()*2-1)*(1-i/d.length);
      n.buffer=b;const f=ac.createBiquadFilter();f.type='highpass';f.frequency.value=7000;const g=ac.createGain();g.gain.value=0.35;n.connect(f).connect(g).connect(out);n.start(t);}
    if(s%8===4){const n=ac.createBufferSource(),b=ac.createBuffer(1,8820,44100),d=b.getChannelData(0);for(let i=0;i<d.length;i++)d[i]=(Math.random()*2-1)*Math.pow(1-i/d.length,2);
      n.buffer=b;const f=ac.createBiquadFilter();f.type='bandpass';f.frequency.value=1800;const g=ac.createGain();g.gain.value=0.9;n.connect(f).connect(g).connect(out);n.start(t);}
    if(s%2===0){const m=bass[(step>>4)%4]+(s%4?12:0),o=ac.createOscillator(),g=ac.createGain();o.type='sawtooth';o.frequency.value=440*Math.pow(2,(m-69)/12);
      const f=ac.createBiquadFilter();f.type='lowpass';f.frequency.value=900;g.gain.setValueAtTime(0.25,t);g.gain.exponentialRampToValueAtTime(0.001,t+beat/2);o.connect(f).connect(g).connect(out);o.start(t);o.stop(t+beat/2);}
    if(s%4===2){for(const k of [0,4,7]){const o=ac.createOscillator(),g=ac.createGain();o.type='triangle';o.frequency.value=440*Math.pow(2,(bass[(step>>4)%4]+36+k-69)/12);
      g.gain.setValueAtTime(0.08,t);g.gain.exponentialRampToValueAtTime(0.001,t+beat);o.connect(g).connect(out);o.start(t);o.stop(t+beat);}}
    step++;t0+=beat/4;}}
  sched();demoTimer=setInterval(sched,50);info('Demo ritim 118 BPM');};
function info(t){document.getElementById('info').textContent=t;}

// ---- VoiceWave emulation ----
const S_MAX=12;const L={u:new Float32Array(S_MAX+1),d:new Float32Array(S_MAX+1)},R={u:new Float32Array(S_MAX+1),d:new Float32Array(S_MAX+1)};
let cu=0,cd=0,nextLeft=true,gain=4,lastUpd=-1e9,lastPeak=0;
function level(v){return v<=P.gate?0:Math.min(1,Math.pow(v*gain,P.curve));}
function push(pos,neg){const peak=Math.max(pos,neg);lastPeak=peak;
  if(peak>P.gate)gain+=(Math.min(P.gainMax,P.gainTarget/peak)-gain)*P.gainSpeed;
  const up=level(pos),dn=level(neg),side=(nextLeft||!P.alternate)?L:R;
  for(const sd of (P.alternate?[side]:[L,R])){sd.u.copyWithin(2,1,S_MAX);sd.d.copyWithin(2,1,S_MAX);sd.u[1]=cu;sd.d[1]=cd;}
  cu=up;cd=dn;nextLeft=!nextLeft;}
function slice(){ // Visualizer.getWaveForm: latest 1024 samples as 8-bit
  const buf=new Float32Array(an.fftSize);an.getFloatTimeDomainData(buf);let mx=0,mn=0;
  const n=Math.max(8,Math.round(P.windowMs/1000*ac.sampleRate));for(let i=buf.length-n;i<buf.length;i++){const v=Math.round(buf[i]*128)/128;if(v>mx)mx=v;if(v<mn)mn=v;}
  push(mx,-mn);}
function taper(k){if(k<=P.flat)return 1;if(k>=P.taperEnd)return 0;const t=(k-P.flat)/(P.taperEnd-P.flat);return .5+.5*Math.cos(Math.PI*t);}
function render(){const g=new Float32Array(625);
  const st=(x,u,d,w)=>{g[12*25+x]=1;const hu=Math.round(u*w*P.maxH),hd=Math.round(d*w*P.maxH);
    for(let dy=1;dy<=hu;dy++)g[(12-dy)*25+x]=1;for(let dy=1;dy<=hd;dy++)g[(12+dy)*25+x]=1;};
  for(let k=0;k<=P.span;k++){const w=taper(k);if(k===0)st(12,cu,cd,w);else{st(12-k,L.u[k],L.d[k],w);st(12+k,R.u[k],R.d[k],w);}}
  return g;}
const cv=document.getElementById('m'),c2=cv.getContext('2d'),sp=document.getElementById('spec'),s2=sp.getContext('2d');
function drawMatrix(g){const S=cv.width,cell=S*0.88/25,o=(S-cell*25)/2;
  c2.clearRect(0,0,S,S);c2.fillStyle='#000';c2.beginPath();c2.arc(S/2,S/2,S/2,0,7);c2.fill();
  for(let y=0;y<25;y++)for(let x=0;x<25;x++){const k=y*25+x;if(!EXISTS[k])continue;
    const v=g[k],c=v>0?Math.round(31+224*Math.pow(v,0.6)):28;
    c2.fillStyle=`rgb(${c},${c},${c})`;c2.beginPath();c2.arc(o+(x+.5)*cell,o+(y+.5)*cell,cell*.37,0,7);c2.fill();}}
function drawSpec(){const W=sp.width,H=sp.height;s2.clearRect(0,0,W,H);s2.fillStyle=getComputedStyle(document.body).color;
  const buf=an?new Float32Array(an.fftSize):null;if(!buf)return;an.getFloatTimeDomainData(buf);s2.globalAlpha=.7;
  for(let x=0;x<W;x++){const v=buf[Math.floor(x/W*buf.length)];s2.fillRect(x,H/2-v*H/2,1,Math.max(1,v*H));}s2.globalAlpha=1;}
let next=0;
function loop(now){requestAnimationFrame(loop);if(now<next)return;next=now+P.frameMs;
  if(src&&an){slice();lastUpd=now;}
  const active=now-lastUpd<P.staleMs;
  drawMatrix(active?render():new Float32Array(625));drawSpec();
  if(src)document.getElementById('info').title=`gain ${gain.toFixed(2)} · peak ${lastPeak.toFixed(3)}`;}
drawMatrix(new Float32Array(625));requestAnimationFrame(loop);
</script>
</body>
</html>
