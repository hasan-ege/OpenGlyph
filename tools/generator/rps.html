const HANDS=[ICONS.rock,ICONS.paper,ICONS.scissors];
const ROWS=[7,11,15,17,19,21,21,23,23,25,25,25,25,25,25,25,23,23,21,21,19,17,15,11,7];
const ex=(x,y)=>{if(y<0||y>24)return false;const s=(25-ROWS[y])>>1;return x>=s&&x<s+ROWS[y];};
const ON=7, FILL=2;
// Timing (ms): mirrors the Java toy.
const BOB=330, BOBS=3, SHAKE=BOB*BOBS, REVEAL=260, SHOW=4000;
function blank(){return Array.from({length:25},()=>new Array(25).fill(0));}
function stamp(g,icon,dx,dy,scale){for(let y=0;y<25;y++)for(let x=0;x<25;x++){const v=icon[y][x];if(!v)continue;
  const X=x+dx,Y=y+dy;if(X<0||X>24||Y<0||Y>24)continue;g[Y][X]=Math.max(g[Y][X],Math.round((v===2?ON:FILL)*scale));}}
function frameAt(state,t){
  const g=blank();
  if(state.mode==='idle'){ // hands take turns, with a soft cross-fade
    const per=900,i=Math.floor(t/per)%3,u=(t%per)/per;
    stamp(g,HANDS[i],0,0,u<0.8?1:1-(u-0.8)/0.2*0.7);
    return g;}
  const tt=t-state.start;
  if(tt<SHAKE){ // fist bobs three times; a dot fills on each bob
    const k=Math.floor(tt/BOB),u=(tt%BOB)/BOB;
    const dy=Math.round(-3*Math.sin(Math.PI*u));
    stamp(g,HANDS[0],0,dy-1,1);
    for(let i=0;i<3;i++){const x=10+i*2;g[22][x]=i<=k?ON:FILL;}
    return g;}
  const rt=tt-SHAKE;
  if(rt<SHOW+REVEAL){
    const hand=HANDS[state.pick];
    if(rt<REVEAL){ // a ring sweeps in from the rim, the hand appears behind it
      const r=12.5*(1-rt/REVEAL);
      for(let y=0;y<25;y++)for(let x=0;x<25;x++){const d=Math.hypot(x-12,y-12);
        if(Math.abs(d-r)<1.0&&ex(x,y))g[y][x]=ON;else if(d>r&&hand[y][x])g[y][x]=hand[y][x]===2?ON:FILL;}
      return g;}
    const breathe=0.82+0.18*Math.cos((rt-REVEAL)/1000*Math.PI*1.6);
    stamp(g,hand,0,0,breathe);
    return g;}
  state.mode='idle';state.idleFrom=t;return frameAt(state,t);
}
const cv=document.getElementById('m'),ctx=cv.getContext('2d');
function draw(g){const S=cv.width,cell=S*0.88/25,o=(S-cell*25)/2;ctx.clearRect(0,0,S,S);
  ctx.fillStyle='#000';ctx.beginPath();ctx.arc(S/2,S/2,S/2,0,7);ctx.fill();
  for(let y=0;y<25;y++)for(let x=0;x<25;x++){if(!ex(x,y))continue;const v=g[y][x],c=v?Math.round(31+224*Math.pow(v/7,0.6)):28;
    ctx.fillStyle='rgb('+c+','+c+','+c+')';ctx.beginPath();ctx.arc(o+(x+.5)*cell,o+(y+.5)*cell,cell*.37,0,7);ctx.fill();}}
let state={mode:'idle'};
function loop(t){draw(frameAt(state,t));requestAnimationFrame(loop);}
requestAnimationFrame(loop);
